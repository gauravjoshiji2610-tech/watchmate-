# Coturn TURN Server Configuration for WatchMate
#
# This file configures the Coturn STUN/TURN relay server.
# Replace all placeholder values with your actual domain and credentials
# before deploying to production.
#
# Reference: https://github.com/coturn/coturn/wiki/turnserver

# ─────────────────────────────────────────────
# Network / Listening Ports
# ─────────────────────────────────────────────

# Listening port for STUN and TURN (plain UDP/TCP)
listening-port=3478

# Listening port for TURNS over TLS (secure)
tls-listening-port=5349

# Relay port range for WebRTC ICE media streams
min-port=49152
max-port=65535

# ─────────────────────────────────────────────
# Domain
# ─────────────────────────────────────────────

# Replace with your actual production domain
realm=your-domain.com

# ─────────────────────────────────────────────
# TLS Certificates (required for TURNS / secure context)
# ─────────────────────────────────────────────
# Paths to your TLS certificate and private key.
# Use Let's Encrypt / Certbot to obtain certificates.
# Example: /etc/letsencrypt/live/your-domain.com/fullchain.pem

cert=/etc/ssl/certs/turn-server.pem
pkey=/etc/ssl/private/turn-server-key.pem

# ─────────────────────────────────────────────
# Authentication
# ─────────────────────────────────────────────

# Long-term static credential authentication
# Replace with a secure random password (min 32 characters)
user=watchmate:REPLACE_WITH_STRONG_TURN_PASSWORD

# ─────────────────────────────────────────────
# Security
# ─────────────────────────────────────────────

# Deny loopback relay
no-loopback-peers

# Deny multicast relay
no-multicast-peers

# ─────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────

log-file=/var/log/turnserver/turnserver.log
verbose
