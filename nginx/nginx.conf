user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 16k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Upstream Backend
    upstream watchmate_backend {
        server server:3001;
    }

    # ─────────────────────────────────────────────
    # HTTP → HTTPS Redirect
    # ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─────────────────────────────────────────────
    # HTTPS Server
    # ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name your-domain.com;

        ssl_certificate     /etc/ssl/certs/watchmate.pem;
        ssl_certificate_key /etc/ssl/private/watchmate-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ─────────────────────────────────────────────
        # Frontend: React SPA static assets
        # ─────────────────────────────────────────────
        location / {
            # The client container's Nginx serves from its own root.
            # Here we proxy to the client container on its internal port 80.
            proxy_pass http://client:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ─────────────────────────────────────────────
        # REST API
        # ─────────────────────────────────────────────
        location /api/ {
            proxy_pass http://watchmate_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─────────────────────────────────────────────
        # Socket.IO (WebSocket Upgrade)
        # ─────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://watchmate_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
